<svg xmlns="http://www.w3.org/2000/svg" width="960" height="252" viewBox="0 0 960 252" role="img" aria-label="Simulation agent: from a sentence to an eCADSTAR result"><title>Simulation agent: from a sentence to an eCADSTAR result</title><defs><marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8c959f"/></marker><marker id="tail" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8c959f"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/><rect x="10" y="24" width="170" height="100" rx="10" fill="#ffffff" stroke="#475569" stroke-width="1.5"/><rect x="10" y="24" width="170" height="100" rx="10" fill="#475569" fill-opacity="0.07"/><path d="M20,24 H170" stroke="#475569" stroke-width="3" stroke-linecap="round"/><text x="95.0" y="52.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10" font-weight="700" fill="#475569" text-anchor="middle" letter-spacing="1.2">REQUEST</text><text x="95.0" y="71.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14.5" font-weight="600" fill="#1f2328" text-anchor="middle">Plain English</text><text x="95.0" y="89.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#59636e" text-anchor="middle">“Run a TDR with 100 Ω</text><text x="95.0" y="105.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#59636e" text-anchor="middle">and a 100 mm line”</text><rect x="210" y="24" width="170" height="100" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="1.5"/><rect x="210" y="24" width="170" height="100" rx="10" fill="#0f766e" fill-opacity="0.07"/><path d="M220,24 H370" stroke="#0f766e" stroke-width="3" stroke-linecap="round"/><text x="295.0" y="52.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10" font-weight="700" fill="#0f766e" text-anchor="middle" letter-spacing="1.2">PARSER</text><text x="295.0" y="71.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14.5" font-weight="600" fill="#1f2328" text-anchor="middle">Rule-based parser</text><text x="295.0" y="89.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#59636e" text-anchor="middle">SI · FD · TDR</text><text x="295.0" y="105.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#59636e" text-anchor="middle">ohms · millimetres</text><rect x="410" y="24" width="170" height="100" rx="10" fill="#ffffff" stroke="#4f46e5" stroke-width="1.5"/><rect x="410" y="24" width="170" height="100" rx="10" fill="#4f46e5" fill-opacity="0.07"/><path d="M420,24 H570" stroke="#4f46e5" stroke-width="3" stroke-linecap="round"/><text x="495.0" y="60.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10" font-weight="700" fill="#4f46e5" text-anchor="middle" letter-spacing="1.2">CONTRACT</text><text x="495.0" y="79.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14.5" font-weight="600" fill="#1f2328" text-anchor="middle">SimulationRequest</text><text x="495.0" y="97.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#59636e" text-anchor="middle">TDR · 100 Ω · 100 mm</text><rect x="610" y="24" width="170" height="100" rx="10" fill="#ffffff" stroke="#b45309" stroke-width="1.5"/><rect x="610" y="24" width="170" height="100" rx="10" fill="#b45309" fill-opacity="0.07"/><path d="M620,24 H770" stroke="#b45309" stroke-width="3" stroke-linecap="round"/><text x="695.0" y="52.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10" font-weight="700" fill="#b45309" text-anchor="middle" letter-spacing="1.2">ADAPTER</text><text x="695.0" y="71.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14.5" font-weight="600" fill="#1f2328" text-anchor="middle">eCADSTAR GUI</text><text x="695.0" y="89.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#59636e" text-anchor="middle">patch circuit file</text><text x="695.0" y="105.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#59636e" text-anchor="middle">run on P2P topology</text><rect x="810" y="24" width="140" height="100" rx="10" fill="#ffffff" stroke="#9333ea" stroke-width="1.5"/><rect x="810" y="24" width="140" height="100" rx="10" fill="#9333ea" fill-opacity="0.07"/><path d="M820,24 H940" stroke="#9333ea" stroke-width="3" stroke-linecap="round"/><text x="880.0" y="52.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10" font-weight="700" fill="#9333ea" text-anchor="middle" letter-spacing="1.2">VISION AGENT</text><text x="880.0" y="71.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14.5" font-weight="600" fill="#1f2328" text-anchor="middle">Result → text</text><text x="880.0" y="89.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#59636e" text-anchor="middle">plot described</text><text x="880.0" y="105.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#59636e" text-anchor="middle">for the agent</text><path d="M180,74 H210" fill="none" stroke="#8c959f" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#head)"/><path d="M380,74 H410" fill="none" stroke="#8c959f" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#head)"/><path d="M580,74 H610" fill="none" stroke="#8c959f" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#head)"/><path d="M780,74 H810" fill="none" stroke="#8c959f" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#head)"/><rect x="210" y="164" width="170" height="72" rx="10" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5" stroke-dasharray="5 4"/><text x="295.0" y="186.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10" font-weight="700" fill="#0f766e" text-anchor="middle" letter-spacing="1.2">FALLBACK</text><text x="295.0" y="205.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14.5" font-weight="600" fill="#1f2328" text-anchor="middle">Sentence-BERT</text><text x="295.0" y="223.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#59636e" text-anchor="middle">only if no analysis named</text><path d="M295,124 V164" fill="none" stroke="#8c959f" stroke-width="1.6" stroke-linejoin="round" stroke-dasharray="5 4" marker-start="url(#tail)" marker-end="url(#head)"/><text x="400" y="194" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#59636e" text-anchor="start">weak matches are rejected,</text><text x="400" y="210" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#59636e" text-anchor="start">so the agent asks instead of guessing</text></svg>
