[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pcb-cad-llm-assistant"
version = "0.1.0"
description = "Testable contracts and utilities for a multi-agent PCB CAD assistant"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Kovarthanam Muthusamy" }]
dependencies = []

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "ruff>=0.9,<1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
