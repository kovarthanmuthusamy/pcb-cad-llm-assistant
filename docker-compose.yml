# Local stack: an Ollama server plus the assistant (interactive CLI) and the RAG web UI.
#
#   docker compose up -d ollama
#   docker compose exec ollama ollama pull deepseek-r1:32b
#   docker compose exec ollama ollama pull nomic-embed-text
#   PCB_ORCHESTRATOR_MODEL=deepseek-r1:32b docker compose run --rm assistant
#   docker compose up webui            # http://127.0.0.1:5000
#
# The eCADSTAR simulation tool needs Windows with eCADSTAR installed, so inside the container it
# answers with an error message instead of running a simulation. The other tools work.

x-assistant: &assistant
  build:
    context: .
    target: runtime
  image: pcb-assistant:runtime
  env_file:
    - path: .env
      required: false
  environment:
    OLLAMA_HOST: http://ollama:11434
    PCB_ORCHESTRATOR_MODEL: ${PCB_ORCHESTRATOR_MODEL:-deepseek-r1:70b}
  volumes:
    - assistant-data:/data
  depends_on:
    - ollama

services:
  ollama:
    image: ollama/ollama:latest  # pin a tag for reproducible runs
    volumes:
      - ollama-models:/root/.ollama
    ports:
      - "127.0.0.1:11434:11434"
    # With the NVIDIA Container Toolkit installed, uncomment to give Ollama the GPU:
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]

  assistant:
    <<: *assistant
    stdin_open: true
    tty: true

  webui:
    <<: *assistant
    entrypoint: ["python", "-m", "pcb_assistant.rag.webui.app"]
    command: []
    ports:
      - "127.0.0.1:5000:5000"

volumes:
  ollama-models:
  assistant-data:
